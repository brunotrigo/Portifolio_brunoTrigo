<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bruno trigo</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <video class="video-fundo" src="../img/video/nebulosa.mp4" autoplay loop muted playsinline>
        <source src="../img/video/nebulosa.mp4" type="video/mp4">
    </video>
    <div class="mascara-video"></div>

    <header class="cabecalho">
        <div class="logo">
            <img src="../img/logo_cabecalho.png" alt="Logo Bruno Trigo">
        </div>
        <button class="botao-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="menu" id="menu-principal" aria-label="Menu principal">
            <a href="../index.html">Home</a>
            <a href="../index.html#conteudo">Conteúdo</a>
            <a href="../index.html#feedback">Feedback</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main class="container">
        <div class="card-cadastro">
            <span class="etiqueta-secao">Área de cadastro</span>
            <h1 class="titulo-login">cadastrar</h1>
            <p class="suave">Faça seu cadastro para poder fazer login.</p>

            <form class=" formulario-cadastro" id="form-login" novalidate>
                <div class="campo campo-cadastro linha-dupla">
                    <label for="nome-completo">nome completo</label>
                    <input type="text" id="nome-completo" autocomplete="username" placeholder="Digite seu nome com minimo de 15 letras" required />
                </div>

                <div class="campo campo-cadastro">
                    <label for="ususario"> Nome de usuario</label>
                    <input type="text" id="usuario" autocomplete="username" placeholder="Digite seu usuario" required />
                </div>

                <div class="campo campo-cadastro">
                    <label for="email">Login</label>
                    <input type="text" id="email" autocomplete="username" placeholder="Digite seu e-mail" required />
                </div>

                <div class="campo campo-cadastro">
                    <label for="senha">Senha</label>
                    <input type="text" id="senha" autocomplete="username" placeholder="Digite sua senha minimo de 8 caracteres" required />
                </div>

                <div class="campo campo-cadastro">
                    <label for="senha-confirma">confirmação da senha</label>
                    <input type="password" id="senha-confirma" autocomplete="current-password" placeholder="Repita sua senha" required />
                </div>
          
                <p class="erro" id="erro-login"></p>
                
            </form>

            <div class="campo-botao">
                <button class="botao botao-cadastro" type="submit">cadastrar</button>
                <button class="botao" type="submit">Login</button>
            </div>
            
        </div>
    </main>

    <footer>© 2026 Portfólio aluno de ADS · Projeto pessoal/acadêmico de ADS</footer>

    <script src="../java_script/menu.js"></script>
</body>
</html>
