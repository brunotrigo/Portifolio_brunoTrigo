<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bruno trigo</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <video class="video-fundo" src="../img/video/nebulosa.mp4" autoplay loop muted playsinline>
        <source src="../img/video/nebulosa.mp4" type="video/mp4">
    </video>
    <div class="mascara-video"></div>

    <header class="cabecalho">
        <div class="logo">
            <img src="../img/logo_cabecalho.png" alt="Logo Bruno Trigo">
        </div>
        <button class="botao-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="menu" id="menu-principal" aria-label="Menu principal">
            <a href="../index.html">Home</a>
            <a href="../index.html#conteudo">Conteúdo</a>
            <a href="../index.html#feedback">Feedback</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main class="container">
        <div class="card-login card-cadastro">
            <span class="etiqueta-secao">Área de cadastro</span>
            <h1 class="titulo-login">Cadastrar</h1>
            <p class="suave">Crie sua conta para acessar a área do cliente.</p>

            <form class="formulario" id="form-cadastro" novalidate>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" autocomplete="name" placeholder="Digite seu nome" required />
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="email" placeholder="Digite seu e-mail" required />
                </div>

                <div class="campo">
                    <label for="data-nascimento">Data de nascimento</label>
                    <input type="date" id="data-nascimento" autocomplete="bday" required />
                </div>

                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" autocomplete="username" placeholder="Digite seu usuário" required />
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" autocomplete="new-password" placeholder="Crie uma senha" required />
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" autocomplete="new-password" placeholder="Repita sua senha" required />
                </div>

                <p class="erro" id="erro-cadastro" role="alert"></p>
                <p class="sucesso" id="sucesso-cadastro" role="status"></p>
                <div class="acoes-cadastro">
                    <button class="botao" type="submit">Criar conta</button>
                    <a class="link-login" href="login.html">Já tenho uma conta</a>
                </div>
            </form>
        </div>
    </main>

    <footer>© 2026 Portfólio aluno de ADS · Projeto pessoal/acadêmico de ADS</footer>

    <script src="../java_script/menu.js"></script>
    <script src="../java_script/cadastro.js"></script>
</body>
</html>
