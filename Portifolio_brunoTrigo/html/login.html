<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bruno trigo</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <video class="video-fundo" src="../img/video/nebulosa.mp4" autoplay loop muted playsinline>
        <source src="../img/video/nebulosa.mp4" type="video/mp4">
    </video>
    <div class="mascara-video"></div>

    <header class="cabecalho">
        <div class="logo">
            <img src="../img/logo_cabecalho.png" alt="Logo Bruno Trigo">
        </div>
        <button class="botao-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="menu" id="menu-principal" aria-label="Menu principal">
            <a href="../index.html">Home</a>
            <a href="../index.html#conteudo">Conteúdo</a>
            <a href="../index.html#feedback">Feedback</a>
            <a href="#login">Login</a>
        </nav>
    </header>
    <main class="container">
        <div class="card-login">
            <span class="etiqueta-secao">Área do cliente</span>
            <h1 class="titulo-login">Entrar</h1>
            <p class="suave">Acesse sua conta se ja tem cadastro.</p>

            <form class="formulario" id="form-login" novalidate>
                <div class="campo">
                    <label for="login">Login</label>
                    <input type="text" id="login" autocomplete="username" placeholder="Digite seu usuário ou e-mail" required />
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" autocomplete="current-password" placeholder="Digite sua senha" required />
                </div>
          
                <p class="erro" id="erro-login"></p>
                <button class="botao" type="submit">Entrar</button>
                <a class="botao botao-cadastro" href="cadastro.html">
                    Cadastrar
                </a>
            </form>
        </div>
    </main>

    <footer>© 2026 Portfólio aluno de ADS · Projeto pessoal/acadêmico de ADS</footer>

    <script src="../java_script/menu.js"></script>
</body>
</html>
