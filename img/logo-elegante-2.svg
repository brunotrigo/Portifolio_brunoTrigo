<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="400" fill="#0a0a0a" rx="24"/>

  <!-- Anel fino -->
  <circle cx="200" cy="185" r="115" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Monograma B/T interligado com linha vertical central -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff" text-anchor="middle">
    <text x="150" y="230" font-size="130">B</text>
    <text x="250" y="230" font-size="130" fill-opacity="0.9">T</text>
  </g>

  <!-- Linha vertical central separando as letras, como uma assinatura -->
  <line x1="200" y1="130" x2="200" y2="245" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Assinatura estilo cursivo abaixo -->
  <text x="200" y="330" font-family="'Brush Script MT', cursive" font-size="30" fill="#ffffff" text-anchor="middle">Bruno Trigo</text>

  <!-- Linha de destaque -->
  <line x1="150" y1="345" x2="250" y2="345" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
</svg>
